name: Build DarkTunnel Pro
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle Official
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        
    - name: Download and Inject Native Xray Core
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        curl -L -s -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-android-arm64-v8a.zip"
        unzip -q -o xray.zip xray -d app/src/main/jniLibs/arm64-v8a/
        mv app/src/main/jniLibs/arm64-v8a/xray app/src/main/jniLibs/arm64-v8a/libxray.so
        rm -f xray.zip
        
    - name: Build APK without Wrapper
      run: gradle assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DarkTunnel-Pro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
